[Lidarr]
api_key = yourlidarrapikeygoeshere
host_url = http://lidarr:8686
download_dir = /data/slskd_downloads
disable_sync = False

[Slskd]
api_key = yourslskdapikeygoeshere
host_url = http://slskd:5030
url_base = /
download_dir = /downloads
delete_searches = False
stalled_timeout = 3600
remote_queue_timeout = 300

[Release Settings]
use_selected_lidarr_release = False
use_most_common_tracknum = True
allow_multi_disc = True
accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
skip_region_check = False
accepted_formats = CD,Digital Media,Vinyl

[Search Settings]
search_timeout = 5000
maximum_peer_queue = 50
minimum_peer_upload_speed = 0
minimum_filename_match_ratio = 0.8
minimum_search_interval = 5
allowed_filetypes = flac 24/192,flac 16/44.1,flac,mp3 320,mp3
ignored_users = User1,User2,Fred,Bob
album_prepend_artist = False
search_type = incrementing_page
number_of_albums_to_grab = 10
title_blacklist = BlacklistWord1,blacklistword2
search_blacklist = WordToStripFromSearch1,WordToStripFromSearch2
search_source = missing
failed_import_denylist = True
# Wanted-list processing order: albums.title (upstream default, alphabetical by album),
# artists.sortname (work artist-by-artist, completing each before moving on), releasedate
search_sort_key = artists.sortname
# Lidarr album types to process (Album, EP, Single, Broadcast, Other...). Empty = process every type.
processed_album_types = Album,EP,Single
# Per-type quality ladders, same format as allowed_filetypes. Empty = inherit allowed_filetypes.
album_allowed_filetypes =
ep_allowed_filetypes =
single_allowed_filetypes =
# Album types that must come from folders containing every proof file extension
# below and no audio besides flac. Empty = proof gate off. Example: Album
require_proof_album_types =
# Extensions a folder must contain to pass the proof gate
proof_files = log,cue
# Accept folders WITHOUT proof files when their name parses (Lidarr-style) to this
# album with an explicit FLAC token (scene/WEB releases carry no log/cue by nature).
# False = log+cue folders only. Folder contents must be all-FLAC either way.
proof_accept_scene_names = True
# Max user directory fetches per album while hunting proof-verified folders
max_directory_probes = 30
# Skip singles whose tracks are already covered by an album in the library
skip_singles_on_albums = False
# Strip noise from search queries; retries the raw query once if the sanitized one returns nothing
sanitize_search_queries = True

[Download Settings]
download_filtering = True
use_extension_whitelist = False
extensions_whitelist = lrc,nfo,txt
rename_download_folders = True
# Skip albums whose renamed staging folder already exists in the download dir
# or that were already grabbed within the last staged_memory_days
skip_already_staged = True
staged_memory_days = 7

[Logging]
level = INFO
# https://docs.python.org/3/library/logging.html#logrecord-attributes
format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
# https://docs.python.org/3/library/time.html#time.strftime
datefmt = %Y-%m-%dT%H:%M:%S%z
# Enable logging to a file in addition to stdout
log_to_file = True
# Log filename (resolved relative to the data/var directory)
log_file = soularr.log
# Maximum log file size in bytes before rotation (default: 1MB)
max_bytes = 1048576
# Number of rotated log files to keep
backup_count = 3
